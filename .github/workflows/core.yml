name: core

on:
  push:
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./scripts/test-core.sh
      - run: ./scripts/test-encoding.sh
      - run: ./scripts/test-base64.sh
      - run: ./scripts/test-console.sh
      - run: ./scripts/test-console-android.sh
      - run: ./scripts/test-url.sh
      - run: ./scripts/test-bodies.sh
      - run: ./scripts/test-fetch.sh
      - run: ./scripts/test-fetch-okhttp.sh
      - run: ./scripts/test-timing.sh
      - run: ./scripts/test-timing-android.sh
      - run: ./scripts/test-geometry.sh
      - run: ./scripts/test-geometry-matrix.sh
      - run: ./scripts/test-native-elements.sh
      - run: ./scripts/test-native-elements-android.sh
      - run: ./scripts/test-native-element-relations.sh
      - run: ./scripts/test-native-element-collections.sh
      - run: ./scripts/test-websocket.sh
      - run: ./scripts/test-websocket-okhttp.sh
      - run: ./scripts/test-runtime-owned-transports.sh
      - name: Publish connector-visible result
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'jvm-www/core',
              description: state === 'success'
                ? 'Java 8 Web, Android renderer, timing, geometry, Fetch, and WebSocket conformance passed'
                : 'Java 8 Web, Android renderer, timing, geometry, Fetch, or WebSocket conformance failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
