name: core

on:
  push:
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./scripts/test-core.sh
      - name: Publish connector-visible result
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'jvm-www/core',
              description: state === 'success'
                ? 'Java 8 runtime conformance passed'
                : 'Java 8 runtime conformance failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
